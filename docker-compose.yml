# SQL Server for local development only. The password below is a throwaway local
# placeholder - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the untracked .env file}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the untracked .env file};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "${Jwt__Issuer:?Set Jwt__Issuer in the untracked .env file}"
      Jwt__Audience: "${Jwt__Audience:?Set Jwt__Audience in the untracked .env file}"
      Jwt__SigningKey: "${Jwt__SigningKey:?Set Jwt__SigningKey in the untracked .env file}"
      Jwt__TokenLifetimeMinutes: "${Jwt__TokenLifetimeMinutes:?Set Jwt__TokenLifetimeMinutes in the untracked .env file}"
      DevelopmentCredentials__Password: "${DevelopmentCredentials__Password:?Set DevelopmentCredentials__Password in the untracked .env file}"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  supportdesk-sql:
